<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Minotaur's Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Cinzel:wght@600;800;900&display=swap">
<style>
/* Layout: one-screen arena — imperial header strip, square torchlit arena canvas, action dock; lobby and scoreboard sheets slide over the arena */
:root{
  --night:#130d0a; --stone:#211812; --stone-2:#31241a; --line:#5b432f;
  --gold:#d9ad52; --gold-deep:#9c7127; --crimson:#9b1e19; --crimson-hi:#c4302a;
  --ink:#f3e9d6; --muted:#b8a386; --sand:#dcc08a;
  --p0:#c8342c; --p1:#3d7fd6; --p2:#3e9e5a; --p3:#9a5ccc;
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --body:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:radial-gradient(120% 80% at 50% 0%,#2a1c13 0%,var(--night) 60%);background-color:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto}
.bar{display:flex;align-items:center;gap:9px;padding-block:10px 6px}
.spqr{font-family:var(--display);font-weight:900;font-size:12px;letter-spacing:.14em;color:var(--gold);background:var(--crimson);border:1px solid var(--gold-deep);padding:4px 7px 3px;border-radius:3px}
.brand{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.04em;color:var(--sand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip{font-family:var(--display);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.spacer{flex:1}
.net{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--p2);box-shadow:0 0 8px var(--p2)}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--stone);color:var(--ink);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center}
.frame{position:relative;width:300px;height:300px}
canvas{display:block;width:100%;height:100%;border-radius:16px;box-shadow:0 0 0 2px #3b2a1c,0 0 0 4px #1a120c,0 10px 40px rgba(0,0,0,.6);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.hud{position:absolute;top:1%;left:50%;transform:translateX(-50%);width:32%;text-align:center;pointer-events:none}
.hud .sec{font-family:var(--display);font-weight:900;font-size:clamp(22px,7vw,40px);line-height:1;color:var(--ink);text-shadow:0 2px 8px rgba(0,0,0,.8);font-variant-numeric:tabular-nums}
.hud .sec.hot{color:#ff6b3d}
.hud .lbl{font-family:var(--display);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);text-shadow:0 1px 4px #000}
.track{height:5px;border-radius:5px;background:rgba(0,0,0,.5);margin-top:5px;overflow:hidden}
.track i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold));border-radius:5px;transform-origin:left}
.banner{position:absolute;left:0;right:0;top:3%;text-align:center;pointer-events:none;padding-block:12px;background:linear-gradient(90deg,transparent,rgba(110,18,14,.88) 15%,rgba(110,18,14,.88) 85%,transparent);border-block:1px solid rgba(217,173,82,.55);animation:bannerIn .5s ease-out}
.banner b{display:block;font-family:var(--display);font-weight:900;font-size:clamp(26px,8vw,46px);color:var(--gold);letter-spacing:.1em;text-shadow:0 2px 0 #3d0c08}
.banner span{font-size:clamp(14px,4vw,18px);color:var(--ink)}
@keyframes bannerIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.victory{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding-inline:6%;background:radial-gradient(closest-side,rgba(18,10,6,.8),rgba(18,10,6,0))}
.victory svg{width:min(70%,380px);height:auto;margin-bottom:-4%;animation:rise .8s ease-out both}
.victory small{font-family:var(--display);font-weight:800;font-size:clamp(15px,4.6vw,24px);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);animation:rise .6s ease-out both}
.victory strong{font-family:var(--display);font-weight:900;font-size:clamp(38px,12vw,80px);line-height:1.05;color:var(--gold);text-shadow:0 0 26px rgba(255,170,60,.55),0 4px 0 #5a3a16;animation:slam .7s cubic-bezier(.2,1.6,.4,1) .25s both;overflow-wrap:anywhere}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes slam{from{opacity:0;transform:scale(2.2)}to{opacity:1;transform:scale(1)}}
.dock{min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding-block:8px 14px;color:var(--muted);font-size:15px;line-height:1.35;text-wrap:balance}
.dock strong{color:var(--ink);font-weight:600}
.dock small{font-size:13px;color:var(--muted)}
.btn{appearance:none;border:1px solid #f0cf7c;border-radius:12px;padding:12px 20px;font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.06em;cursor:pointer;background:linear-gradient(180deg,#e9c066,#b98a33);color:#2a1508;box-shadow:0 3px 0 #6e4c16;text-transform:uppercase}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #6e4c16}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:linear-gradient(180deg,var(--crimson-hi),var(--crimson));color:var(--ink);border-color:#d1574f;box-shadow:0 3px 0 #4e0d0a}
.acts{display:flex;gap:10px;justify-content:center;width:100%;max-width:440px}
.btn.turn{font-size:18px;padding:14px 12px;flex:1 1 0;min-width:0}
.roll{font-size:20px;padding:14px 30px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.sheet{position:absolute;inset:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding-block:10px;background:rgba(14,9,6,.74);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:5}
.card{width:100%;max-width:440px;background:linear-gradient(180deg,#2a1e15,var(--stone));border:1px solid var(--line);border-top:3px solid var(--crimson);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;margin-block:auto;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.crest{display:flex;flex-direction:column;align-items:center;text-align:center}
.crest svg{width:150px;height:auto;margin-bottom:-58px}
.card h1,.card h2{font-family:var(--display);font-weight:900;color:var(--gold);margin:0;text-wrap:balance;letter-spacing:.05em;text-align:center}
.card h1{font-size:26px}
.card h2{font-size:22px}
.motto{font-family:var(--display);font-size:11px;font-weight:800;letter-spacing:.24em;color:var(--muted);margin-top:4px}
.rules{margin:0;color:var(--muted);line-height:1.45;font-size:15px}
.rules b{color:var(--ink);font-weight:600}
.joinrow{display:flex;gap:8px}
.joinrow input{flex:1;min-width:0;font:inherit;font-size:17px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--night);color:var(--ink)}
.seats{list-style:none;margin:0;padding:0;display:grid;gap:7px;grid-template-columns:1fr 1fr}
.lobbybar{display:flex;flex-direction:column;gap:8px;padding-block:8px 12px;width:100%;max-width:520px;margin:0 auto}
.lobbybar .btn{padding:11px 14px;font-size:15px}
.invite{display:flex;gap:12px;align-items:center;background:var(--stone);border:1px solid var(--line);border-radius:14px;padding:10px}
#qr{width:112px;height:112px;border-radius:6px;flex:none;image-rendering:pixelated;background:#fff}
.inv-txt{display:flex;flex-direction:column;gap:5px;min-width:0}
.inv-txt b{font-family:var(--display);color:var(--gold);font-size:17px}
.inv-txt span{color:var(--muted);font-size:14px}
.inv-txt strong{font-family:var(--display);letter-spacing:.18em;color:var(--ink);font-size:19px;margin-left:4px}
.inv-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn.small{padding:8px 12px;font-size:13px}
#newroom{color:var(--muted);font-size:13px}
.lobbybar .status{font-size:13px;text-align:center}
.seat{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:10px;background:var(--stone-2);min-height:40px;border-left:4px solid transparent;min-width:0;font-size:15px}
.seat .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat.empty .nm{color:var(--muted);font-weight:400}
.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tag.you{color:var(--gold)}
.x{appearance:none;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;width:30px;height:30px;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.status{font-size:14px;color:var(--muted);line-height:1.4}
.notice{font-size:14px;color:#ff8a5c;line-height:1.4}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:9px 4px;text-align:right;white-space:nowrap;border-bottom:1px solid rgba(91,67,47,.5)}
td.army{font-family:var(--display);font-weight:900;color:var(--gold);font-size:17px}
td .who{display:flex;align-items:center;gap:7px;font-weight:600;max-width:120px}
td .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.win td{background:rgba(217,173,82,.12)}
.vhead{display:flex;flex-direction:column;align-items:center;text-align:center}
.vhead svg{width:120px;height:auto;margin-bottom:-6px}
.vhead small{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);animation:rise .6s ease-out both}
.vhead strong{font-family:var(--display);font-weight:900;font-size:clamp(34px,9vw,52px);line-height:1.1;color:var(--gold);text-shadow:0 0 22px rgba(255,170,60,.45),0 3px 0 #5a3a16;overflow-wrap:anywhere;animation:slam .7s cubic-bezier(.2,1.6,.4,1) .2s both}
.legend{font-size:13px;color:var(--muted);margin:0;line-height:1.4}
@media (prefers-reduced-motion:reduce){.roll{animation:none}.banner,.victory small,.victory strong,.victory svg{animation:none}}
</style>
</head>
<body>


<div id="app">
  <header class="bar">
    <span class="spqr">ROME</span>
    <div class="brand">Minotaur's Arena</div>
    <div class="chip" id="chip" hidden></div>
    <div class="spacer"></div>
    <div class="net"><span class="dot" id="netdot"></span><span id="nettxt">Connecting</span></div>
    <button class="iconbtn" id="mute" aria-label="Mute sound" title="Sound">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
  </header>

  <main class="stage" id="stage">
    <div class="frame" id="frame">
      <canvas id="cv" aria-label="Arena: four strongholds around the caged Minotaur"></canvas>
      <div class="hud" id="hud" hidden><div class="lbl" id="hudlbl">Round</div><div class="sec" id="sec">20</div><div class="track"><i id="bar"></i></div></div>
      <div class="banner" id="banner" hidden><b id="bannerT"></b><span id="bannerS"></span></div>
      <div class="victory" id="victory" hidden><svg class="laurel" viewBox="0 0 200 110" aria-hidden="true"></svg><small>Victory Belongs to</small><strong id="victor"></strong></div>
    </div>


    <section class="sheet" id="score" hidden>
      <div class="card">
        <div class="vhead"><svg class="laurel" viewBox="0 0 200 110" aria-hidden="true"></svg><small>Victory Belongs to</small><strong id="scoreT"></strong></div>
        <div class="tablewrap">
          <table>
            <thead><tr><th>Gladiator</th><th>Spent</th><th>Rammed</th><th>Left</th><th>Result</th></tr></thead>
            <tbody id="scorebody"></tbody>
          </table>
        </div>
        <p class="legend">Spent: gladiators sacrificed to turn or hold the Minotaur. Rammed: gladiators lost to its charges.</p>
        <div class="row">
          <button class="btn ghost" id="lobbybtn" type="button">Back to lobby</button>
          <button class="btn" id="againbtn" type="button">Play again</button>
        </div>
      </div>
    </section>
  </main>

  <section class="lobbybar" id="lobby" hidden>
    <div class="invite">
      <canvas id="qr" width="148" height="148" aria-label="QR code to join this game"></canvas>
      <div class="inv-txt"><b>Scan to join</b><span>Room <strong id="roomcode"></strong></span><div class="inv-row"><button class="btn ghost small" id="copylink" type="button">Copy link</button><a id="newroom" href="./">New room</a></div></div>
    </div>
    <form class="joinrow" id="joinform" autocomplete="off">
      <input id="name" maxlength="14" placeholder="Your username" aria-label="Username">
      <button class="btn" id="joinbtn" type="submit">Join</button>
    </form>
    <ul class="seats" id="seats"></ul>
    <div class="row">
      <button class="btn ghost" id="botbtn" type="button">Add bot</button>
      <button class="btn" id="startbtn" type="button">Start battle</button>
    </div>
    <div class="notice" id="notice" hidden></div>
    <div class="status" id="status"></div>
  </section>

  <footer class="dock" id="dock"></footer>
</div>

<script>
/* Small QR code generator (byte mode, error correction M, versions 1-10). Returns a boolean matrix. */
function makeQR(text) {
  const ECC = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26];
  const BLK = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];
  const data = Array.from(new TextEncoder().encode(text));
  const rawModules = v => { let r = (16 * v + 128) * v + 64; if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; } return r; };
  const dataCap = v => Math.floor(rawModules(v) / 8) - ECC[v] * BLK[v];
  let ver = 0;
  for (let v = 1; v <= 10; v++) { const cc = v <= 9 ? 8 : 16; if (4 + cc + data.length * 8 <= dataCap(v) * 8) { ver = v; break; } }
  if (!ver) throw new Error('Text too long for QR');
  const bits = [];
  const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
  put(4, 4); put(data.length, ver <= 9 ? 8 : 16); data.forEach(b => put(b, 8));
  const capBits = dataCap(ver) * 8;
  put(0, Math.min(4, capBits - bits.length));
  put(0, (8 - bits.length % 8) % 8);
  for (let pad = 0xEC; bits.length < capBits; pad ^= 0xEC ^ 0x11) put(pad, 8);
  const cw = []; for (let i = 0; i < bits.length; i += 8) { let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; cw.push(b); }
  // Reed-Solomon
  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z & 0xFF; };
  const divisor = deg => { const r = new Array(deg).fill(0); r[deg - 1] = 1; let root = 1; for (let i = 0; i < deg; i++) { for (let j = 0; j < r.length; j++) { r[j] = mul(r[j], root); if (j + 1 < r.length) r[j] ^= r[j + 1]; } root = mul(root, 2); } return r; };
  const remainder = (d, div) => { const r = div.map(() => 0); for (const b of d) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= mul(c, f); }); } return r; };
  const nb = BLK[ver], eLen = ECC[ver], raw = Math.floor(rawModules(ver) / 8), nShort = nb - raw % nb, shortLen = Math.floor(raw / nb);
  const div = divisor(eLen), blocks = [];
  for (let i = 0, k = 0; i < nb; i++) { const dat = cw.slice(k, k + shortLen - eLen + (i < nShort ? 0 : 1)); k += dat.length; const ecc = remainder(dat, div); if (i < nShort) dat.push(0); blocks.push(dat.concat(ecc)); }
  const all = []; for (let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if (i !== shortLen - eLen || j >= nShort) all.push(b[i]); });
  // matrix
  const size = ver * 4 + 17, M = Array.from({ length: size }, () => new Array(size).fill(false)), F = Array.from({ length: size }, () => new Array(size).fill(false));
  const fn = (x, y, d) => { M[y][x] = d; F[y][x] = true; };
  for (let i = 0; i < size; i++) { fn(6, i, i % 2 === 0); fn(i, 6, i % 2 === 0); }
  const finder = (x, y) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const d = Math.max(Math.abs(dx), Math.abs(dy)), xx = x + dx, yy = y + dy; if (xx >= 0 && xx < size && yy >= 0 && yy < size) fn(xx, yy, d !== 2 && d !== 4); } };
  finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
  if (ver > 1) {
    const n = Math.floor(ver / 7) + 2, step = Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2, pos = [6];
    for (let p = size - 7; pos.length < n; p -= step) pos.splice(1, 0, p);
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === n - 1) || (i === n - 1 && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) fn(pos[i] + dx, pos[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
  }
  const bit = (v, i) => ((v >>> i) & 1) !== 0;
  const format = mask => {
    const d = (0 << 3) | mask; let r = d; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
    const b = ((d << 10) | r) ^ 0x5412;
    for (let i = 0; i <= 5; i++) fn(8, i, bit(b, i));
    fn(8, 7, bit(b, 6)); fn(8, 8, bit(b, 7)); fn(7, 8, bit(b, 8));
    for (let i = 9; i < 15; i++) fn(14 - i, 8, bit(b, i));
    for (let i = 0; i < 8; i++) fn(size - 1 - i, 8, bit(b, i));
    for (let i = 8; i < 15; i++) fn(8, size - 15 + i, bit(b, i));
    fn(8, size - 8, true);
  };
  format(0);
  if (ver >= 7) { let r = ver; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25); const b = (ver << 12) | r; for (let i = 0; i < 18; i++) { const a = size - 11 + i % 3, c = Math.floor(i / 3); fn(a, c, bit(b, i)); fn(c, a, bit(b, i)); } }
  let i = 0;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
      const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
      if (!F[y][x] && i < all.length * 8) { M[y][x] = bit(all[i >>> 3], 7 - (i & 7)); i++; }
    }
  }
  const maskFn = [(x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x, y) => x % 3 === 0, (x, y) => (x + y) % 3 === 0, (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0, (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0];
  const applyMask = m => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!F[y][x] && maskFn[m](x, y)) M[y][x] = !M[y][x]; };
  const penalty = () => {

  if (S && ['intro', 'round', 'ram', 'ramz', 'raze'].includes(S.ph)) { chip.hidden = false; chip.textContent = 'Round ' + toRoman(S.rd) + ' · ' + S.P.filter(p => p && !p.out).length + ' left'; }
  else if (S && ['victory', 'score'].includes(S.ph)) { chip.hidden = false; chip.textContent = 'Victory'; }
  else chip.hidden = true;

  const ms = mySlot();
  const lob = $('#lobby');
  lob.hidden = !!(S && S.ph !== 'lobby');
  if (!lob.hidden) {
    const list = $('#seats'); list.textContent = '';
    for (let i = 0; i < 4; i++) {
      const p = S ? S.P[i] : null;
      const li = el('li', 'seat' + (p ? '' : ' empty')); li.style.borderLeftColor = p ? PC[i] : 'transparent';
      li.append(el('span', 'nm', p ? p.n : 'Open seat'));
      if (p) {
        if (!p.b && i === ms) li.append(el('span', 'tag you', 'You'));
        else li.append(el('span', 'tag', p.b ? 'Bot' : 'Player'));
        if (p.b) { const x = el('button', 'x', '×'); x.type = 'button'; x.setAttribute('aria-label', 'Remove ' + p.n); x.onclick = () => send('kick', { s: i }); li.append(x); }
      }
      list.append(li);
    }
    const hasS = !!S;
    $('#joinbtn').disabled = !hasS;
    $('#joinbtn').textContent = ms >= 0 ? 'Rename' : 'Join';
    $('#botbtn').disabled = !(hasS && S.P.some(p => !p));
    $('#startbtn').disabled = !(hasS && ms >= 0);
    const st = $('#status');
    if (!hasS) st.textContent = 'Opening the arena gates…';
    else if (online) { const humans = S.P.filter(p => p && !p.b).length; st.textContent = (ms < 0 ? 'Enter a username and join. ' : 'Empty seats are filled with bots when the battle starts. ') + 'Friends scan the QR code to take the other seats' + (humans > 1 ? ' · ' + humans + ' players seated.' : '.'); }
    else st.textContent = 'Can\u2019t reach the game server, so you\u2019re playing against bots. Reload the page to try again.';
    const nEl = $('#notice'); nEl.hidden = !notice; nEl.textContent = notice;
  }
  const ban = $('#banner');
  if (S && S.ph === 'intro' && S.P[S.aim]) { ban.hidden = false; $('#bannerT').textContent = 'ROUND ' + toRoman(S.rd); $('#bannerS').textContent = 'The Minotaur stirs in its cage…'; }
  else ban.hidden = true;
  const win = S && S.w >= 0 ? S.P[S.w] : null;
  $('#victory').hidden = true;
  if (win) $('#victor').textContent = win.n;
  const sc = $('#score');
  sc.hidden = !(S && (S.ph === 'score' || (S.ph === 'victory' && phaseElapsed() > 4400)));
  if (!sc.hidden) {
    $('#scoreT').textContent = win ? win.n : '';
    const body = $('#scorebody'); body.textContent = '';
    const rank = r => r.i === S.w ? 1e9 : (r.p.out || 0);
    for (const { p, i } of S.P.map((p, i) => ({ p, i })).filter(r => r.p).sort((a, b) => rank(b) - rank(a))) {
      const tr = el('tr', i === S.w ? 'win' : '');
      const td0 = el('td'), who = el('div', 'who'), sw = el('span'); sw.style.cssText = `width:10px;height:10px;border-radius:2px;flex:none;background:${PC[i]}`; who.append(sw, el('span', '', p.n + (i === ms ? ' (you)' : ''))); td0.append(who); tr.append(td0);
      [p.u, 20 - p.gl - p.u, p.gl].forEach(v => tr.append(el('td', '', String(v))));
      tr.append(el('td', i === S.w ? 'army' : '', i === S.w ? 'Victor' : p.out ? 'Out · ' + toRoman(p.out) : '—'));
      body.append(tr);
    }
    $('#againbtn').disabled = ms < 0; $('#lobbybtn').disabled = ms < 0;
  }
  const dock = $('#dock'); dock.textContent = '';
  dock.hidden = !S || S.ph === 'lobby' || S.ph === 'score';
  if (dock.hidden) return;
  const me = ms >= 0 ? S.P[ms] : null;
  if (S.ph === 'intro' || S.ph === 'round') {
    if (!me || me.out) dock.append(el('span', '', me ? 'Your stronghold has fallen. Watch who survives.' : 'You are watching this battle. Join from the lobby before the next one.'));
    else {
      const locked = now() < lockEnd, off = S.ph !== 'round' || me.gl < 1 || locked;
      const acts = el('div', 'acts');
      const b = el('button', 'btn turn', '↻ Turn'); b.type = 'button'; b.disabled = off; b.onclick = tryTurn;
      const h = el('button', 'btn ghost turn', '⛓ Hold 2s'); h.type = 'button'; h.disabled = off; h.onclick = tryHold;
      acts.append(b, h); dock.append(acts);
      const facing = S.aim === ms, holder = S.P[S.lkf];
      dock.append(el('small', '', me.gl < 1 ? 'No gladiators left. If the Minotaur reaches you, your stronghold falls.' : me.gl === 1 && S.ph === 'round' && !locked ? 'Your last gladiator! Spend it and your stronghold is defenseless.' : S.ph === 'intro' ? 'Get ready…' : locked ? 'Held by ' + (holder ? holder.n : 'a rival') + '. Nobody can turn it right now.' : (facing ? 'It faces YOU! ' : 'It faces ' + S.P[S.aim].n + '. ') + 'Turn moves it clockwise · Hold freezes it 2s · each costs 1 gladiator'));
    }
  } else if (S.ph === 'ram' && S.ram && S.P[S.ram.s]) {
    dock.append(el('strong', '', S.ram.s === ms ? 'The Minotaur charges you!' : 'The Minotaur charges ' + S.P[S.ram.s].n + '!'));
  } else if (S.ph === 'ramz' && S.ram && S.P[S.ram.s]) {
    dock.append(el('strong', '', 'The Minotaur paws the ground and charges ' + S.P[S.ram.s].n + '!'));
  } else if (S.ph === 'raze' && S.rz && S.P[S.rz.s]) {
    dock.append(el('strong', '', (S.rz.f ? 'The last gladiator runs away! ' : '') + (S.rz.s === ms ? 'The Minotaur destroys your stronghold!' : 'The Minotaur destroys ' + S.P[S.rz.s].n + '\u2019s stronghold!')));
  } else if (S.ph === 'dice') {
    if (me && !me.r) { const b = el('button', 'btn roll', 'Roll ' + me.d.length + (me.d.length === 1 ? ' die' : ' dice')); b.type = 'button'; b.onclick = () => { SFX.dice(); send('roll'); b.disabled = true; }; dock.append(b); }
    else dock.append(el('span', '', me ? 'Rolled. Waiting for the others to roll…' : 'The gladiators are rolling for reinforcements…'));
  } else if (S.ph === 'reveal') dock.append(el('span', '', 'Reinforcements march into each army.'));
  else if (S.ph === 'victory' && S.P[S.w]) dock.append(el('strong', '', S.w === ms ? 'You are the last one standing!' : S.P[S.w].n + ' is the last one standing.'));
  dock.hidden = !dock.childElementCount;
}
(() => {
  const url = location.href, code = window.ROOM_CODE || '';
  $('#roomcode').textContent = code;
  try {
    const M = makeQR(url), n = M.length, q = 4, c = $('#qr'), px = 10, off = 0; c.width = c.height = (n + q * 2) * px; const g = c.getContext('2d');
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height); g.fillStyle = '#000000';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (M[y][x]) g.fillRect(off + (x + q) * px, off + (y + q) * px, px, px);
  } catch (e) { $('#qr').hidden = true; }
  $('#copylink').addEventListener('click', () => {
    const b = $('#copylink'), done = () => { b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy link'; }, 1500); };
    const fail = () => { b.textContent = 'Link: ' + url; }; if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, fail); else fail();
  });
})();
syncUI();
initRoom();
})();
</script>
